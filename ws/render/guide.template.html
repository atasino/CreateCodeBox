<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Your guide</title>
<style>
:root{
  --bg:#f4f6fa; --surface:#ffffff; --surface2:#edf0f6;
  --ink:#1d2330; --muted:#4b5565; --line:#dde2ec; --line2:#b9c1d1;
  --blue:#2457d6; --blue-ink:#ffffff; --blue-soft:#e8eefd; --blue-text:#1f4cc2;
  --amber:#ffb55e; --amber-ink:#1d2330; --amber-soft:#fff5e6; --amber-deep:#c97a14;
  --green:#1b7a48; --green-ink:#ffffff; --green-soft:#e8f6ee; --green-line:#8fd0ad;
  --work:#f3f6ff; --work-line:#bccdf8;
  --chip:#1d2330; --chip-ink:#ffffff; --chip-dim:#98a3b9;
  --shadow:0 1px 2px rgba(29,35,48,.05),0 8px 24px rgba(29,35,48,.06);
  --shadow-turn:0 2px 4px rgba(29,35,48,.05),0 18px 44px rgba(29,35,48,.10);
  --move:cubic-bezier(.22,.8,.24,1);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#131822; --surface:#1d2330; --surface2:#283042;
    --ink:#f3f5f9; --muted:#aab3c5; --line:#323b4f; --line2:#56617a;
    --blue:#8fb0ff; --blue-ink:#131822; --blue-soft:#22304f; --blue-text:#a8c1ff;
    --amber:#ffb55e; --amber-ink:#1d2330; --amber-soft:#33281a; --amber-deep:#ffb55e;
    --green:#6ed5a0; --green-ink:#10241a; --green-soft:#17302a; --green-line:#2f6e53;
    --work:#1b2438; --work-line:#3d5288;
    --chip:#0c1018; --chip-ink:#f3f5f9; --chip-dim:#7c879e;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
    --shadow-turn:0 2px 4px rgba(0,0,0,.3),0 18px 44px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow-wrap:break-word;
  font:17px/1.65 /*__WS_FONT__*/system-ui,-apple-system,"Segoe UI",sans-serif;}
:lang(ja) body{line-break:strict;word-break:auto-phrase}
.wrap{max-width:1120px;margin:0 auto;padding:20px clamp(16px,3vw,32px) 36px}
h1,h2,p,ol,ul{margin:0}
ol,ul{padding:0;list-style:none}
svg.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.ic.solid{fill:currentColor;stroke-width:1.5}
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.sec-h{font-size:19px;line-height:1.4;font-weight:750;margin:0 2px 12px}
a:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

/* header */
.top{display:grid;grid-template-columns:auto minmax(0,auto) minmax(84px,1fr);align-items:center;column-gap:14px}
.mark{grid-column:1;grid-row:1;width:44px;height:44px;border-radius:11px}
.top-txt{grid-column:2;grid-row:1;min-width:0}
.brand{font-size:15px;line-height:1.3;font-weight:700;color:var(--muted)}
h1{font-size:27px;line-height:1.3;font-weight:800}
.lead{grid-column:1/-1;grid-row:2;margin-top:10px;color:var(--muted);font-size:16px;line-height:1.55}
.proj{display:inline-flex;align-items:center;gap:8px;min-width:0;max-width:min(100%,320px);padding:6px 14px 6px 11px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);font-size:16px;font-weight:650;line-height:1.4;grid-column:3;grid-row:1;justify-self:end}
.proj svg{width:19px;height:19px;color:var(--blue-text)}
.proj span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#notice{margin-top:14px;padding:9px 14px;border-radius:12px;background:var(--blue-soft);border:1px solid var(--line);font-size:16px}
.nojs{margin-top:20px}

/* goal */
.goal{margin-top:26px}
.goal-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.goal-top h2{font-size:16px;line-height:1.5;font-weight:750;color:var(--blue-text)}
.for{display:inline-flex;align-items:center;gap:6px;padding:1px 11px 1px 8px;border-radius:999px;border:1px solid var(--line2);
  font-size:15px;line-height:1.6;color:var(--muted)}
.for svg{width:17px;height:17px}
.goal-text{margin-top:6px;font-size:clamp(22px,16px + 1.3vw,30px);line-height:1.4;font-weight:750;max-width:34em;
  overflow-wrap:anywhere;text-wrap:balance}
.goal-text.none{color:var(--muted);font-weight:600}

/* path + turn + progress */
.hero{display:grid;gap:18px;margin-top:22px;align-items:start}
.path{position:relative;isolation:isolate;padding:16px 10px 12px;min-width:0}
.path-h{margin:0 10px 8px;font-size:16px;line-height:1.5;font-weight:750;color:var(--muted)}
.step{position:relative;display:flex;align-items:flex-start;gap:12px;padding:7px 10px}
.dot{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;
  border:2px solid var(--line2);background:var(--surface);color:var(--muted);
  font-size:15px;font-weight:750;line-height:1;font-variant-numeric:tabular-nums;
  transition:background-color .3s,border-color .3s,color .3s,box-shadow .3s}
.dot svg{display:none;width:18px;height:18px;stroke-width:2.6}
.step.done .dot{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.step.done .dot svg{display:block}
.step.done .dot b{display:none}
.step.now .dot{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);box-shadow:0 0 0 4px var(--surface)}
.step:not(:last-child)::before,.step:not(:last-child)::after{content:"";position:absolute;left:23.5px;top:40px;bottom:-4px;width:3px;border-radius:2px;background:var(--line)}
.step:not(:last-child)::after{background:var(--blue);transform:scaleY(0);transform-origin:top;transition:transform .35s var(--move)}
.step.done:not(:last-child)::after{transform:scaleY(1)}
.st-body{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:12px;padding-top:2px}
.st-name{min-width:6.2em;font-size:17px;line-height:26px;font-weight:750;overflow-wrap:normal;transition:color .3s}
.st-hint{flex:1 1 13em;font-size:15px;line-height:22px;color:var(--muted);padding:1px 0 2px}
.step.todo .st-name{color:var(--muted);font-weight:650}
.step.cur .st-name{margin-right:calc(var(--pinw,104px) + 8px);min-width:0}
.step.cur .st-hint{flex-basis:100%;color:var(--ink)}
.cursor{position:absolute;z-index:-1;left:8px;right:8px;top:0;height:var(--h,0px);transform:translateY(var(--y,0px));
  border-radius:14px;background:var(--surface2);opacity:0;
  transition:transform .35s var(--move),height .35s var(--move),opacity .25s}
.cursor.on{opacity:1}
.snap .cursor{transition:none}
.pin{position:absolute;right:9px;top:8px;padding:0 10px;border-radius:999px;background:var(--amber);color:var(--amber-ink);
  font-size:13.5px;line-height:24px;font-weight:750;white-space:nowrap}

.turn{position:relative;overflow:hidden;min-width:0;border-radius:22px;border:2px solid var(--line);background:var(--surface);
  box-shadow:var(--shadow-turn);transition:background-color .3s,border-color .3s,height .3s var(--move)}
.turn.is-you{background:var(--amber-soft);border-color:var(--amber)}
.turn.is-claude{background:var(--work);border-color:var(--work-line)}
.turn.is-done{background:var(--green-soft);border-color:var(--green-line)}
.tl{padding:22px clamp(18px,3vw,28px) 24px}
.tl.out{position:absolute;left:0;right:0;top:0;opacity:0;transition:opacity .18s;pointer-events:none}
.tl.in{animation:fade .3s .12s both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.t-head{font-size:21px;line-height:1.4;font-weight:800}
.badge{display:inline-flex;align-items:center;gap:8px;padding:4px 16px 4px 11px;border-radius:999px;background:var(--amber);color:var(--amber-ink)}
.badge svg{width:17px;height:17px}
.is-claude .t-head{display:flex;align-items:center;gap:12px}
.dots{display:inline-flex;gap:5px;padding:9px 11px;border-radius:999px;background:var(--blue-soft);box-shadow:inset 0 0 0 1px var(--work-line)}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--blue);animation:pulse 1.5s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.2s}
.dots i:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,70%,100%{opacity:.28;transform:scale(.85)}35%{opacity:1;transform:scale(1)}}
.t-text{margin-top:14px;max-width:32em;font-size:clamp(20px,17px + .45vw,23px);line-height:1.5;font-weight:650;overflow-wrap:anywhere}
.is-claude .t-text{font-weight:500}
.t-hint{margin-top:8px;color:var(--muted)}
.is-claude .t-head + .t-hint{margin-top:12px;font-size:clamp(20px,17px + .45vw,23px);line-height:1.5;color:var(--ink)}
.t-stale{display:flex;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:16px;animation:fade .35s both}
.t-stale svg{margin-top:2px}
.t-done{display:flex;align-items:flex-start;gap:16px}
.t-done .t-text{margin-top:4px}
/* a word to type that is named inside a sentence (it comes in backticks): a small chip, never markup from the text */
.t-text code,.lost code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:.9em;font-weight:650;
  padding:.06em .42em;border-radius:8px;background:var(--surface);border:1px solid var(--line2);color:var(--ink);white-space:nowrap}
.okmark{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--green);color:var(--green-ink)}
.okmark svg{width:26px;height:26px;stroke-width:2.8}
.t-links{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.tbtn{display:inline-flex;align-items:center;gap:9px;min-height:48px;padding:6px 14px 6px 12px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line2);color:var(--ink);font-weight:700;text-decoration:none;
  transition:border-color .2s,transform .2s}
.tbtn:hover{border-color:var(--blue);transform:translateY(-1px)}
.tbtn svg:first-child{color:var(--blue-text)}
.tbtn svg:last-child{width:18px;height:18px;color:var(--muted)}
.tbtn.main{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.tbtn.main svg{color:inherit}
.t-say{margin-top:18px}
.t-label{font-size:16px;font-weight:650;color:var(--muted)}
.sayrow{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px;margin-top:8px}
.say{display:inline-flex;align-items:center;gap:.55em;min-width:0;padding:10px 20px 10px 16px;border-radius:14px;
  background:var(--chip);color:var(--chip-ink);border:1px solid var(--chip);
  font:650 clamp(23px,18px + .8vw,26px)/1.35 ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.say i{font-style:normal;color:var(--chip-dim);-webkit-user-select:none;user-select:none}
.say span{overflow-wrap:anywhere;-webkit-user-select:all;user-select:all}
.copy{display:inline-grid;align-items:center;justify-items:center;min-height:54px;padding:0 20px;border:0;border-radius:14px;cursor:pointer;
  background:var(--blue);color:var(--blue-ink);font:inherit;font-size:17px;font-weight:750;white-space:nowrap;
  transition:background-color .2s,transform .2s}
.copy:hover{transform:translateY(-1px)}
.copy:active{transform:none}
.copy > span{grid-area:1/1;display:inline-flex;align-items:center;gap:8px}
.copy .cp-z{visibility:hidden}
.copy.ok .cp-a{visibility:hidden}
.copy.ok .cp-z{visibility:visible}
.copy svg{width:20px;height:20px}
.copy.quiet{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line2)}

.prog{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px 32px;padding:18px 22px 20px;min-width:0}
.pg h2{font-size:16px;line-height:1.5;font-weight:750;color:var(--muted)}
.pg-row + .pg-row{margin-top:12px}
.pg-count{font-size:17px;font-weight:650;line-height:1.5}
.bar{height:10px;margin-top:7px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;width:var(--w,0%);border-radius:999px;background:var(--blue);transition:width .4s var(--move)}
.bar.you i{background:var(--amber-deep)}
.pg-goal{grid-column:1/-1;display:flex;align-items:flex-start;gap:10px;padding-top:14px;border-top:1px solid var(--line);font-weight:650}
.pg-goal:first-child{padding-top:0;border-top:0}
.pg-goal svg{margin-top:3px}
.pg-goal.yes svg{color:var(--green)}
.pg-goal.no svg{color:var(--amber-deep)}

/* things you can open */
.open{min-width:0;margin-top:10px}
.lost,.others{margin-top:30px}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.lk{display:flex;align-items:center;gap:14px;min-height:68px;padding:12px 16px 12px 14px;border-radius:18px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--ink);
  font-weight:700;line-height:1.4;text-decoration:none;transition:border-color .2s,transform .2s}
.lk:hover{border-color:var(--blue);transform:translateY(-1px)}
.lk-ic{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--blue-soft);color:var(--blue-text)}
.lk-t{flex:1;min-width:0}
.lk > svg{width:20px;height:20px;color:var(--muted)}
.lk.app{grid-column:1/-1;min-height:80px;padding:14px 20px 14px 16px;background:var(--blue);border-color:var(--blue);color:var(--blue-ink);font-size:21px;font-weight:800}
.lk.app .lk-ic{width:50px;height:50px;border-radius:15px;background:var(--blue-ink);color:var(--blue)}
.lk.app .lk-ic svg{width:26px;height:26px}
.lk.app > svg{width:24px;height:24px;color:inherit}

/* not sure what to do */
.lost{display:flex;flex-wrap:wrap;align-items:center;gap:14px 32px;padding:20px 22px}
.lost-txt{flex:1 1 320px;min-width:0}
.lost h2{display:flex;align-items:center;gap:9px;font-size:19px;line-height:1.4;font-weight:750}
.lost h2 svg{color:var(--blue-text)}
.lost-txt p{margin-top:5px;color:var(--muted)}
.lost .sayrow{margin-top:0}
.lost .say{font-size:22px}

/* other projects */
.olist li{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 20px;padding:12px 20px;border-top:1px solid var(--line)}
.olist li:first-child{border-top:0}
.o-name{font-weight:700;overflow-wrap:anywhere}
.o-step{color:var(--muted);font-size:16px}

footer{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 18px;margin-top:34px;color:var(--muted);font-size:15px}

@media (min-width:720px){
  .hero{grid-template-columns:clamp(292px,34%,372px) minmax(0,1fr);grid-template-rows:auto auto auto 1fr;gap:0 22px}
  .hero > .prog{margin-top:18px}
  .hero > .open{margin-top:26px}
  .hero.solo{grid-template-columns:minmax(0,1fr)}
  .hero > *{grid-column:2}
  .hero > .path{grid-column:1;grid-row:1 / span 4;padding-bottom:14px}
  .hero.solo > *{grid-column:1}
  .step{padding-top:9px;padding-bottom:9px}
  .step:not(:last-child)::before,.step:not(:last-child)::after{top:42px;bottom:-6px}
  .st-hint{flex-basis:100%}
}
@media (min-width:960px){
  .top{grid-template-columns:auto auto minmax(0,1fr) auto;column-gap:16px}
  .lead{grid-column:3;grid-row:1;align-self:end;margin:0;padding-bottom:4px}
  .proj{grid-column:4}
}
@media (max-width:719px){
  /* a narrow window beside the terminal: what to do now comes before the map */
  .hero > .turn{order:-1}
}
@media (max-width:480px){
  /* the project name goes up beside the product name, so the title keeps one line */
  .top{column-gap:12px}
  .top-txt{display:contents}
  .mark{grid-row:1 / span 2;width:40px;height:40px}
  .brand{grid-column:2;grid-row:1;align-self:center}
  h1{grid-column:2 / -1;grid-row:2;font-size:24px}
  .lead{grid-row:3}
  .proj{gap:6px;padding:2px 11px 2px 8px;font-size:15px}
  .proj svg{width:17px;height:17px}
  .tl{padding-top:18px;padding-bottom:20px}
  .lost .say{font-size:22px}
  .lost .sayrow,.lost .copy{flex:1 1 auto}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <svg class="mark" viewBox="0 0 512 512" aria-hidden="true" focusable="false">
      <rect width="512" height="512" rx="102.4" fill="#2457d6"/>
      <rect x="256" y="51" width="205" height="205" rx="36.9" fill="#ffb55e"/>
      <rect x="121.5" y="121.5" width="269" height="269" rx="68.9" fill="#2457d6"/>
      <rect x="153.5" y="153.5" width="205" height="205" rx="36.9" fill="#ffffff"/>
      <rect x="19" y="224" width="269" height="269" rx="68.9" fill="#2457d6"/>
      <rect x="51" y="256" width="205" height="205" rx="36.9" fill="#ffffff"/>
    </svg>
    <div class="top-txt">
      <p class="brand">CreateCodeBox</p>
      <h1 id="title" data-l="title">Your guide</h1>
    </div>
    <p class="lead" data-l="lead">Where you are, and what to do next. This page updates by itself.</p>
    <p class="proj" id="proj" hidden></p>
  </header>
  <p id="notice" role="status" hidden></p>

  <main>
    <section class="goal" id="goal" aria-labelledby="h-goal" hidden>
      <div class="goal-top">
        <h2 id="h-goal" data-l="goal_head">Your goal</h2>
        <span class="for" id="goal-for" hidden></span>
      </div>
      <p class="goal-text" id="goal-text"></p>
    </section>

    <div class="hero" id="hero">
      <section class="card path" id="path" aria-labelledby="h-path" hidden>
        <h2 class="path-h" id="h-path"></h2>
        <ol id="steps"></ol>
        <div class="cursor" id="cursor" aria-hidden="true"><span class="pin" id="pin"></span></div>
      </section>
      <section class="turn" id="turn" aria-labelledby="h-turn" aria-live="polite" aria-atomic="true" hidden></section>
      <div class="card prog" id="prog" hidden>
        <div class="pg" id="pg-build">
          <h2 data-l="build_head">Build</h2>
          <p class="pg-count" id="pg-build-n"></p>
          <div class="bar" aria-hidden="true"><i id="pg-build-b"></i></div>
        </div>
        <div class="pg" id="pg-checks">
          <h2 data-l="checks_head">Checks</h2>
          <div class="pg-row" id="pg-you">
            <p class="pg-count" id="pg-you-n"></p>
            <div class="bar you" aria-hidden="true"><i id="pg-you-b"></i></div>
          </div>
          <div class="pg-row" id="pg-claude">
            <p class="pg-count" id="pg-claude-n"></p>
            <div class="bar" aria-hidden="true"><i id="pg-claude-b"></i></div>
          </div>
        </div>
        <p class="pg-goal" id="pg-goal"></p>
      </div>
      <section class="open" id="open" aria-labelledby="h-open" hidden>
        <h2 class="sec-h" id="h-open" data-l="open_head">Things you can open</h2>
        <div class="links" id="links"></div>
      </section>
    </div>

    <section class="card lost" id="lost" aria-labelledby="h-lost" hidden>
      <div class="lost-txt">
        <h2 id="h-lost"></h2>
        <p data-l="lost_body">Type the word below in Claude Code. Claude tells you where you are and the one next step.</p>
      </div>
      <div class="sayrow" id="lost-say"></div>
    </section>

    <section class="others" id="others" aria-labelledby="h-others" hidden>
      <h2 class="sec-h" id="h-others" data-l="others_head">Other projects</h2>
      <ul class="card olist" id="olist"></ul>
    </section>

    <noscript><p class="lead nojs"><!--ws-noscript-->Turn on JavaScript to see this page.</p></noscript>
  </main>

  <footer>
    <span id="upd"></span>
    <span><span data-l="footer">Made with CreateCodeBox</span> <span id="ver"></span></span>
  </footer>
  <span class="vh" id="copy-status" role="status"></span>
</div>

<script type="application/json" id="ws-data">/*__WS_DATA__*/null</script>
<script type="application/json" id="ws-labels">/*__WS_LABELS__*/null</script>
<script type="application/json" id="ws-labels-default">{
 "loading": "Loading…",
 "footer": "Made with CreateCodeBox",
 "noscript": "Turn on JavaScript to see this page.",

    if (p) { setPath(p.step, p.next.kind === 'done', move); }

    var b = p ? p.build : { done: 0, total: 0 }, c = p ? p.checks : { you_pass: 0, you_total: 0, claude_pass: 0, claude_total: 0 };
    var reached = p ? p.goal_reached : null;
    $('pg-build').hidden = !b.total;
    $('pg-you').hidden = !c.you_total;
    $('pg-claude').hidden = !c.claude_total;
    $('pg-checks').hidden = !(c.you_total || c.claude_total);
    $('pg-goal').hidden = reached === null;
    $('prog').hidden = !(b.total || c.you_total || c.claude_total || reached !== null);
    $('pg-build-n').textContent = fmt(L.build_count, { done: b.done, total: b.total });
    $('pg-you-n').textContent = fmt(L.checks_you, { p: c.you_pass, t: c.you_total });
    $('pg-claude-n').textContent = fmt(L.checks_claude, { p: c.claude_pass, t: c.claude_total });
    bar('pg-build-b', b.done, b.total); bar('pg-you-b', c.you_pass, c.you_total); bar('pg-claude-b', c.claude_pass, c.claude_total);
    if (reached !== null) {
      var pg = clear($('pg-goal'));
      pg.className = 'pg-goal ' + (reached ? 'yes' : 'no');
      pg.appendChild(icon(reached ? 'check' : 'notyet'));
      pg.appendChild(el('span', '', reached ? L.goal_yes : L.goal_no));
    }

    /* the app first: it is the thing the person came for */
    var links = p ? p.links.filter(function (l) { return l.id === 'app'; }).concat(p.links.filter(function (l) { return l.id !== 'app'; })) : [];
    var lk = JSON.stringify(links);
    if (lk !== linksKey) {
      linksKey = lk;
      var box = clear($('links'));
      links.forEach(function (l) { box.appendChild(openLink(l, 'lk' + (l.id === 'app' ? ' app' : ''), true)); });
    }
    $('open').hidden = !links.length;

    if (!lostMade) {
      lostMade = true;
      var lh = $('h-lost');
      lh.appendChild(icon('help')); lh.appendChild(el('span', '', L.lost_head));
      $('lost-say').appendChild(sayChip(L.lost_say, 'lost-words'));
      $('lost-say').appendChild(copyButton(L.lost_say, 'lost-words', true));
      $('lost').hidden = false;
    }

    var ol = clear($('olist')), others = d.others;
    others.forEach(function (o) {
      var row = el('li');
      row.appendChild(el('span', 'o-name', o.name));
      row.appendChild(el('span', 'o-step', fmt(L.step_of, { n: o.step }) + ' · ' + W('step.' + o.step)));
      ol.appendChild(row);
    });
    $('others').hidden = !others.length;

    $('upd').textContent = d.generated ? fmt(L.updated, { time: shortTime(d.generated) }) : '';
    $('ver').textContent = d.version;
  }

  /* ---------- it updates by itself ---------- */
  var lastKey = '', since = madeAt(data.generated), STALE = 10 * 60 * 1000;
  function keyOf(d) { var g = d.generated, k; d.generated = ''; k = JSON.stringify(d); d.generated = g; return k; }
  function checkStale() {
    var n = $('stale');
    if (n) { n.hidden = !(view && view.state === 'claude' && Date.now() - since >= STALE); }
  }
  function show(d, move) {
    var k = keyOf(d);
    if (k === lastKey) { return; }
    if (lastKey) { since = Date.now(); }
    lastKey = k;
    render(d, move);
    checkStale();
  }
  show(data, false);

  /* the workspace writes guide.data.js next to this page; that file calls this with the new data.
     The call must carry the word the workspace put into this page; a call with another word is ignored. */
  var TOKEN = /*__WS_TOKEN__*/"";
  window.__CCB_GUIDE__ = function (token, d) {
    if (!TOKEN || typeof token !== 'string' || token !== TOKEN) { return; }
    var n = norm(d);
    if (n) { notice.hidden = true; show(n, true); }
  };
  var tag = null;
  function poll() {
    checkStale();
    if (state === 'default' || document.hidden) { return; }
    var s = document.createElement('script');
    s.src = 'guide.data.js?t=' + Date.now();
    s.onerror = function () { /* no such file (yet): what is shown stays */ };
    if (tag && tag.parentNode) { tag.parentNode.removeChild(tag); }
    tag = s;
    document.head.appendChild(s);
  }
  window.setInterval(poll, 2000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { poll(); } });
})();
</script>
