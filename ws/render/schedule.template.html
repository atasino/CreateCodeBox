<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Road to done</title>
<style>
:root{
  --bg:#f5f6fb; --surface:#ffffff; --surface2:#eef1f9;
  --text:#1c2333; --muted:#4f5a70; --border:#d3d9e9;
  --accent:#3552d6; --accent-soft:#e3e9ff;
  --ok:#17794a; --ok-soft:#dff3e8;
  --hold:#59627a; --hold-soft:#eceef4;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 10px 28px rgba(20,30,60,.07);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e121b; --surface:#171d2b; --surface2:#1f2738;
    --text:#e9edf7; --muted:#aab4c9; --border:#2d374e;
    --accent:#93a9ff; --accent-soft:#232c4a;
    --ok:#5fd394; --ok-soft:#173629;
    --hold:#a5afc4; --hold-soft:#232a3a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.75 /*__WS_FONT__*/system-ui,-apple-system,"Segoe UI",sans-serif;}
.wrap{max-width:860px;margin:0 auto;padding:28px 16px 40px}
h1{font-size:28px;line-height:1.35;margin:4px 0 6px}
h2{font-size:20px;margin:0 0 12px;line-height:1.4}
.eyebrow{margin:0;color:var(--accent);font-weight:700;letter-spacing:.08em}
.lead{margin:0;color:var(--muted)}
section{margin-top:28px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow)}
#notice{margin:14px 0 0;padding:10px 14px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--border)}
#notice[hidden]{display:none}

/* stage stepper */
.stepper-card{padding:22px 10px 18px}
.stepper{position:relative;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,1fr)}
.track,.fill{position:absolute;top:19px;left:8.333%;height:4px;border-radius:2px}
.track{width:83.334%;background:var(--border)}
.fill{width:0;background:var(--accent);transition:width 1.1s cubic-bezier(.3,.7,.2,1) .2s}
.step{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.dotc{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  background:var(--surface);border:3px solid var(--border);color:var(--muted);font-weight:800;font-size:14px;
  transition:background .4s,border-color .4s,color .4s,transform .4s}
.step.lit .dotc{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.step.lit.past .dotc{background:var(--ok);border-color:var(--ok)}
.step.now .dotc{transform:scale(1.12)}
.step.now .dotc::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid var(--accent);opacity:0;animation:pulse 2s ease-out infinite}
.dotc svg{width:22px;height:22px}
.s-name{font-weight:700;font-size:15px;line-height:1.4;margin-top:4px}
.s-state{font-size:14px;color:var(--muted);line-height:1.4}
.step.now .s-state{color:var(--accent);font-weight:700}
.step.past .s-state{color:var(--ok);font-weight:700}
.stage-line{margin:16px 6px 0;text-align:center}

/* progress */
.prog{padding:22px 20px}
.bignum{display:flex;align-items:baseline;justify-content:center;gap:8px;flex-wrap:wrap}
.bignum .n{font-size:56px;font-weight:800;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums}
.bignum .of{font-size:20px;color:var(--muted)}
.bignum .pct{font-size:20px;font-weight:700;margin-left:6px;font-variant-numeric:tabular-nums}
.bar{margin:14px 0 12px;height:18px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--ok));transition:width 1.2s cubic-bezier(.3,.7,.2,1) .3s}
.counts{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;margin:0;padding:0;list-style:none}
.counts li{display:inline-flex;align-items:center;gap:6px}
.counts b{font-variant-numeric:tabular-nums}
.sum{margin:12px 0 0;text-align:center;color:var(--muted)}

/* timeline of rows */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:19px;top:12px;bottom:12px;width:4px;border-radius:2px;background:var(--border)}
.item{position:relative;padding:0 0 16px 56px;animation:rise .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*80ms + 300ms)}
.item:last-child{padding-bottom:0}
.mk{position:absolute;left:0;top:10px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  background:var(--surface);border:3px solid var(--border);color:var(--muted)}
.mk svg{width:22px;height:22px}
.item.done .mk{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.item.doing .mk{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.item.doing .mk::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--accent);opacity:0;animation:pulse 2s ease-out infinite}
.item.hold .mk{background:var(--hold-soft);border-color:var(--hold);color:var(--hold)}
.chk{stroke-dasharray:26;stroke-dashoffset:26;animation:draw .5s ease forwards;animation-delay:calc(var(--i,0)*80ms + 700ms)}
.box{padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow)}
.item.doing .box{border:3px solid var(--accent);background:var(--accent-soft)}
.item.hold .box{background:var(--hold-soft);box-shadow:none}
.item.hold .ttl{color:var(--hold)}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.id{font-size:14px;color:var(--muted);font-weight:700}
.st{display:inline-block;padding:0 10px;border-radius:999px;font-size:14px;font-weight:700;line-height:1.7;border:2px solid currentColor}
.st.done{color:var(--ok)} .st.doing{color:var(--accent)} .st.todo{color:var(--muted)} .st.hold{color:var(--hold)}
.here{font-size:14px;font-weight:800;color:var(--surface);background:var(--accent);padding:0 10px;border-radius:999px;line-height:1.7}
.ttl{margin:4px 0 0;font-size:18px;font-weight:700;line-height:1.5;overflow-wrap:anywhere}
.item.doing .ttl{font-size:20px}
dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
dt{color:var(--muted);font-size:15px;font-weight:700}
dd{margin:0;overflow-wrap:anywhere}
dd code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:15px;background:var(--surface2);padding:1px 6px;border-radius:6px}
.why{margin:8px 0 0;padding:8px 12px;border-radius:10px;background:var(--surface);border:2px dashed var(--hold);color:var(--text)}
.why b{color:var(--hold)}
.empty{padding:20px;color:var(--muted)}
footer{margin-top:36px;text-align:center;font-size:13px;color:var(--muted)}

@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{opacity:.7;transform:scale(.9)}80%{opacity:0;transform:scale(1.25)}100%{opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}

@media (max-width:430px){
  h1{font-size:24px}
  .stepper-card{padding:20px 4px 16px}
  .dotc{width:38px;height:38px}
  .track,.fill{top:17px}
  .s-name{font-size:14px}
  .bignum .n{font-size:48px}
  .item{padding-left:50px}
  .tl::before{left:16px}
  .mk{width:36px;height:36px}
  .mk svg{width:20px;height:20px}
  dl{grid-template-columns:1fr;gap:0}
  dd{margin-bottom:6px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .chk{stroke-dashoffset:0}
  .step.now .dotc::after,.item.doing .mk::after{display:none}
}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <p class="eyebrow" data-l="title">Road to done</p>
    <h1 id="title" data-l="loading">Loading…</h1>
    <p class="lead" data-l="lead">The whole road to a finished app, on one page.</p>
    <p id="notice" role="status" hidden></p>
  </header>

  <section aria-labelledby="h-stage">
    <h2 id="h-stage" data-l="h_stage">Where are we now</h2>
    <div class="card stepper-card">
      <ol class="stepper" id="stepper">
        <li class="track" aria-hidden="true" style="list-style:none"></li>
        <li class="fill" id="fill" aria-hidden="true" style="list-style:none"></li>
      </ol>
      <p class="stage-line" id="stage-line"></p>
    </div>
  </section>

  <section aria-labelledby="h-prog">
    <h2 id="h-prog" data-l="h_prog">How far along overall</h2>
    <div class="card prog">
      <div class="bignum" aria-hidden="true"><span class="n" id="n-done">0</span><span class="of" id="n-total"></span><span class="pct" id="n-pct"></span></div>
      <div class="bar" id="bar" role="progressbar" data-l-aria="progress_aria" aria-label="Overall progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="bar-in"></i></div>
      <ul class="counts" id="counts"></ul>
      <p class="sum" id="sum"></p>
    </div>
  </section>

  <section aria-labelledby="h-tl">
    <h2 id="h-tl" data-l="h_tl">What to do (from the top)</h2>
    <ol class="tl" id="tl"></ol>
  </section>

  <noscript><p class="lead"><!--ws-noscript-->Turn on JavaScript to see this page.</p></noscript>
  <footer data-l="footer">Made with CreateCodeBox</footer>
</main>

<script type="application/json" id="ws-data">/*__WS_DATA__*/null</script>
<script type="application/json" id="ws-labels">/*__WS_LABELS__*/null</script>
<script type="application/json" id="ws-labels-default">{
 "loading": "Loading…",
 "footer": "Made with CreateCodeBox",
 "noscript": "Turn on JavaScript to see this page.",
 "notice_sample": "A sample is shown for now.",
 "notice_bad": "The data could not be read, so a sample is shown.",
 "app_default": "This app",
 "title": "Road to done",
 "lead": "The whole road to a finished app, on one page.",
 "h_stage": "Where are we now",
 "h_prog": "How far along overall",
 "progress_aria": "Overall progress",
 "h_tl": "What to do (from the top)",
 "stage_r0": "Start",
 "stage_r1": "Goal",
 "stage_r2": "Idea",
 "stage_r3": "Look",
 "stage_r4": "Design",
 "stage_run": "Build",
 "s_past": "done",
 "s_now": "now",
 "s_next": "later",
 "step_aria": "{name} ({code}): {state}",
 "step_past": "finished",
 "step_now": "you are here",
 "step_next": "coming next",
 "stage_line_run": "Now at \"{name}\" ({code}). You have reached the step where you run and use it.",
 "stage_line_more": "Now at \"{name}\" ({code}). {n} more steps and it starts running.",
 "of_total": "/ {total} items",
 "bar_text": "{done} of {total} items are done",
 "st_done": "Done",
 "st_doing": "In progress",
 "st_todo": "Next",
 "st_hold": "On hold",
 "sum_all": "{done} of {total} items are done.",
 "sum_doing": " Now working on \"{title}\".",
 "sum_alldone": " Everything is done.",
 "sum_none": "There is nothing to do yet.",
 "here": "You are here",
 "dt_done_when": "How to tell it is done",
 "dt_artifact": "What it makes",
 "why_hold": "Why it is on hold: ",
 "why_note": "Note: ",
 "why_blank": "(not written yet)",
 "sample_project": "Sample app",
 "s1_title": "Ask who will use it",
 "s1_done": "You can say what it is for in one sentence",
 "s2_title": "Compare 3 ideas for the screen",
 "s2_done": "The user says \"looks good\"",
 "s3_title": "Make something that runs",
 "s3_done": "You can run it on your computer and check it"
}</script>
<script>
(function () {
  'use strict';

  /* ---------- words: English defaults, replaced by the labels the workspace passes in ---------- */
  function readJson(id) {
    var node = document.getElementById(id);
    var raw = node ? node.textContent : '';
    raw = raw.replace(/^\s*\/\*[\s\S]*?\*\/\s*/, '').trim();
    if (!raw || raw === 'null') { return {}; }
    try { var o = JSON.parse(raw); return (o && typeof o === 'object') ? o : {}; } catch (e) { return {}; }
  }
  var L = readJson('ws-labels-default'), passed = readJson('ws-labels');
  Object.keys(passed).forEach(function (k) { L[k] = passed[k]; });
  function fmt(s, kw) {
    return String(s).replace(/\{(\w+)\}/g, function (m, k) { return Object.prototype.hasOwnProperty.call(kw, k) ? String(kw[k]) : m; });
  }
  Array.prototype.forEach.call(document.querySelectorAll('[data-l]'), function (n) { if (L[n.getAttribute('data-l')] !== undefined) { n.textContent = L[n.getAttribute('data-l')]; } });
  Array.prototype.forEach.call(document.querySelectorAll('[data-l-aria]'), function (n) { if (L[n.getAttribute('data-l-aria')] !== undefined) { n.setAttribute('aria-label', L[n.getAttribute('data-l-aria')]); } });

  var DEFAULT_DATA = {
    project: L.sample_project,
    stage: 'R1',
    rows: [
      { id: 'S-01', title: L.s1_title, status: 'done', done_when: L.s1_done, artifact: 'goal/GOAL.md', note: '' },
      { id: 'S-02', title: L.s2_title, status: 'doing', done_when: L.s2_done, artifact: 'design/', note: '' },
      { id: 'S-03', title: L.s3_title, status: 'todo', done_when: L.s3_done, artifact: 'src/', note: '' }
    ]
  };
  var STAGES = [
    { code: 'R0', name: L.stage_r0 }, { code: 'R1', name: L.stage_r1 }, { code: 'R2', name: L.stage_r2 },
    { code: 'R3', name: L.stage_r3 }, { code: 'R4', name: L.stage_r4 }, { code: 'RUN', name: L.stage_run }
  ];
  var STATUS = {
    done:  { label: L.st_done },
    doing: { label: L.st_doing },
    todo:  { label: L.st_todo },
    hold:  { label: L.st_hold }
  };
  var SVGNS = 'http://www.w3.org/2000/svg';
  var reduced = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };

  function str(v) { return v === null || v === undefined ? '' : String(v); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) { e.className = cls; }
    if (text !== undefined && text !== null) { e.textContent = text; }
    return e;
  }
  function sv(tag, attrs) {
    var e = document.createElementNS(SVGNS, tag);
    for (var k in attrs) { if (Object.prototype.hasOwnProperty.call(attrs, k)) { e.setAttribute(k, attrs[k]); } }
    return e;
  }
  function svg(paths, cls) {
    var s = sv('svg', { viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': '3', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true', focusable: 'false' });
    paths.forEach(function (d) { var p = sv('path', { d: d }); if (cls) { p.setAttribute('class', cls); } s.appendChild(p); });
    return s;
  }

  /* ---------- read the data ---------- */
  function readData() {
    var node = document.getElementById('ws-data');
    var raw = node ? node.textContent : '';
    raw = raw.replace(/^\s*\/\*[\s\S]*?\*\/\s*/, '').trim();
    if (!raw || raw === 'null') { return { data: DEFAULT_DATA, state: 'default' }; }
    try {
      var d = JSON.parse(raw);
      if (d && typeof d === 'object' && Array.isArray(d.rows)) { return { data: d, state: 'ok' }; }
    } catch (e) { /* fall back to the sample */ }
    return { data: DEFAULT_DATA, state: 'bad' };
  }

  var loaded = readData();
  var data = loaded.data;
  var projectName = str(data.project) || L.app_default;
  var rows = data.rows.map(function (r, i) {
    r = r || {};
    var st = str(r.status);
    if (!STATUS[st]) { st = 'todo'; }
    return {
      id: str(r.id) || ('S-' + (i + 1)),
      title: str(r.title),
      status: st,
      done_when: str(r.done_when),
      artifact: str(r.artifact),
      note: str(r.note)
    };
  });
  var stageIdx = 0;
  STAGES.forEach(function (s, i) { if (s.code === str(data.stage)) { stageIdx = i; } });

  document.title = L.title + ' - ' + projectName;
  document.getElementById('title').textContent = projectName;
  var notice = document.getElementById('notice');
  if (loaded.state === 'default') { notice.textContent = L.notice_sample; notice.hidden = false; }
  if (loaded.state === 'bad') { notice.textContent = L.notice_bad; notice.hidden = false; }

  /* ---------- stage stepper ---------- */
  var stepper = document.getElementById('stepper');
  var fill = document.getElementById('fill');
  STAGES.forEach(function (s, i) {
    var li = el('li', 'step' + (i <= stageIdx ? ' lit' : '') + (i < stageIdx ? ' past' : '') + (i === stageIdx ? ' now' : ''));
    var state = i < stageIdx ? L.s_past : (i === stageIdx ? L.s_now : L.s_next);
    li.setAttribute('aria-label', fmt(L.step_aria, { name: s.name, code: s.code, state: (i < stageIdx ? L.step_past : (i === stageIdx ? L.step_now : L.step_next)) }));
    var dot = el('span', 'dotc');
    if (i < stageIdx) { dot.appendChild(svg(['M5 12.5l4.5 4.5L19 7.5'])); }
    else { dot.textContent = s.code === 'RUN' ? '▶' : s.code; }
    li.appendChild(dot);
    li.appendChild(el('span', 's-name', s.name));
    li.appendChild(el('span', 's-state', state));
    stepper.appendChild(li);
  });
  document.getElementById('stage-line').textContent =
    fmt(stageIdx === STAGES.length - 1 ? L.stage_line_run : L.stage_line_more, { name: STAGES[stageIdx].name, code: STAGES[stageIdx].code, n: STAGES.length - 1 - stageIdx });
  var fillPct = (stageIdx / (STAGES.length - 1)) * 83.334;
  function setFill() { fill.style.width = fillPct + '%'; }
  if (reduced.matches) { fill.style.transition = 'none'; setFill(); }
  else { window.requestAnimationFrame(function () { window.requestAnimationFrame(setFill); }); }

  /* ---------- progress ---------- */
  var counts = { done: 0, doing: 0, todo: 0, hold: 0 };
  rows.forEach(function (r) { counts[r.status] += 1; });
  var total = rows.length;
  var pct = total ? Math.round(counts.done / total * 100) : 0;
  var nDone = document.getElementById('n-done');
  var nPct = document.getElementById('n-pct');
  document.getElementById('n-total').textContent = fmt(L.of_total, { total: total });
  var bar = document.getElementById('bar');
  bar.setAttribute('aria-valuenow', String(pct));
  bar.setAttribute('aria-valuetext', fmt(L.bar_text, { total: total, done: counts.done }));
  var barIn = document.getElementById('bar-in');
  function showNum(v, p) { nDone.textContent = String(Math.round(v)); nPct.textContent = Math.round(p) + '%'; }

  if (reduced.matches || !total) {
    barIn.style.transition = 'none';
    barIn.style.width = pct + '%';
    showNum(counts.done, pct);
  } else {
    showNum(0, 0);
    window.requestAnimationFrame(function () { window.requestAnimationFrame(function () { barIn.style.width = pct + '%'; }); });
    var start = null, dur = 1300, delay = 300;
    var step = function (ts) {
      if (start === null) { start = ts; }
      var t = Math.min(1, Math.max(0, (ts - start - delay) / dur));
      var e = 1 - Math.pow(1 - t, 3);
      showNum(counts.done * e, pct * e);
      if (t < 1) { window.requestAnimationFrame(step); } else { showNum(counts.done, pct); }
    };
    window.requestAnimationFrame(step);
  }

  var cl = document.getElementById('counts');
  ['done', 'doing', 'todo', 'hold'].forEach(function (k) {
    var li = el('li');
    var mark = { done: '✓ ', doing: '● ', todo: '○ ', hold: 'Ⅱ ' }[k];
    li.appendChild(document.createTextNode(mark + STATUS[k].label + ' '));
    li.appendChild(el('b', '', String(counts[k])));
    cl.appendChild(li);
  });
  var doingRow = rows.filter(function (r) { return r.status === 'doing'; })[0];
  var sum = total ? (fmt(L.sum_all, { total: total, done: counts.done }) + (doingRow ? fmt(L.sum_doing, { title: doingRow.title }) : (counts.done === total ? L.sum_alldone : ''))) : L.sum_none;
  document.getElementById('sum').textContent = sum;

  /* ---------- timeline ---------- */
  var tl = document.getElementById('tl');
  if (!rows.length) {
    var li0 = el('li', 'empty', L.sum_none);
    tl.appendChild(li0);
  }
  rows.forEach(function (r, i) {
    var li = el('li', 'item ' + r.status);
    li.style.setProperty('--i', String(Math.min(i, 14)));
    var mk = el('span', 'mk');
    if (r.status === 'done') { mk.appendChild(svg(['M5 12.5l4.5 4.5L19 7.5'], 'chk')); }
    else if (r.status === 'doing') { mk.appendChild(svg(['M8 5l11 7-11 7z'])); }
    else if (r.status === 'hold') { mk.appendChild(svg(['M9 6v12', 'M15 6v12'])); }
    else { mk.appendChild(svg(['M12 12h.01'])); }
    li.appendChild(mk);

    var box = el('div', 'box');
    var head = el('div', 'head');
    head.appendChild(el('span', 'id', r.id));
    head.appendChild(el('span', 'st ' + r.status, STATUS[r.status].label));
    if (r.status === 'doing') { head.appendChild(el('span', 'here', L.here)); }
    box.appendChild(head);
    box.appendChild(el('p', 'ttl', r.title));

    if (r.done_when || r.artifact) {
      var dl = el('dl');
      if (r.done_when) { dl.appendChild(el('dt', '', L.dt_done_when)); dl.appendChild(el('dd', '', r.done_when)); }
      if (r.artifact) {
        dl.appendChild(el('dt', '', L.dt_artifact));
        var dd = el('dd'); dd.appendChild(el('code', '', r.artifact)); dl.appendChild(dd);
      }
      box.appendChild(dl);
    }
    if (r.note) {
      var why = el('p', 'why');
      why.appendChild(el('b', '', r.status === 'hold' ? L.why_hold : L.why_note));
      why.appendChild(document.createTextNode(r.note));
      box.appendChild(why);
    } else if (r.status === 'hold') {
      var why2 = el('p', 'why');
      why2.appendChild(el('b', '', L.why_hold));
      why2.appendChild(document.createTextNode(L.why_blank));
      box.appendChild(why2);
    }
    li.appendChild(box);
    tl.appendChild(li);
  });
})();
</script>
