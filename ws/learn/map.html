<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The GitHub road</title>
<style>
:root{
  --bg:#f7f8fa; --fg:#1d2330; --sub:#4a5468; --card:#ffffff; --line:#c9d0dc;
  --accent:#2457d6; --accent-bg:#e8eefc; --gate:#b45309; --gate-bg:#fff1dd; --dot:#2457d6;
  --focus:#1d2330;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12151b; --fg:#e8ebf2; --sub:#aab3c5; --card:#1c212b; --line:#3a4356;
    --accent:#8fb0ff; --accent-bg:#1f2a47; --gate:#ffb55e; --gate-bg:#3a2a12; --dot:#8fb0ff;
    --focus:#e8ebf2;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:960px;margin:0 auto;padding:24px 16px 32px}
h1{font-size:1.4rem;margin:0 0 4px}
.lead{color:var(--sub);margin:0 0 20px}
.flow{display:flex;align-items:stretch;gap:0;margin:0 0 20px;padding:0;list-style:none}
.step{flex:1 1 0;min-width:0;display:flex;align-items:center}
.box{flex:1 1 auto;min-width:0;width:100%;text-align:left;font:inherit;color:var(--fg);background:var(--card);
  border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.box:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.box[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-bg)}
.box.gate{border-color:var(--gate);background:var(--gate-bg)}
.box.gate[aria-pressed="true"]{outline:3px solid var(--gate)}
.n{display:block;font-size:.875rem;color:var(--sub)}
.t{display:block;font-weight:700}
.w{display:block;font-size:.875rem;color:var(--sub);margin-top:2px}
.tag{display:inline-block;margin-top:6px;padding:0 8px;border-radius:999px;font-size:.875rem;font-weight:700;color:var(--gate);border:1px solid var(--gate)}
.arrow{flex:0 0 44px;height:44px;position:relative}
.arrow svg{width:100%;height:100%;display:block}
.arrow line{stroke:var(--line);stroke-width:3}
.arrow polygon{fill:var(--line)}
.arrow .dot{fill:var(--dot)}
#detail{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:16px}
#detail h2{font-size:1.1rem;margin:0 0 8px}
#detail h3{font-size:1rem;margin:12px 0 4px;color:var(--sub)}
#detail p{margin:0}
.hint{color:var(--sub);margin:0 0 8px;font-size:.95rem}
code{font:.9em ui-monospace,Menlo,Consolas,monospace;background:var(--accent-bg);padding:0 4px;border-radius:4px}
footer{max-width:960px;margin:0 auto;padding:0 16px 24px;text-align:center;font-size:.8rem;color:var(--sub)}
@media (max-width:640px){
  .flow{flex-direction:column}
  .step{flex-direction:column;align-items:stretch}
  .arrow{flex:0 0 40px;width:100%}
  .arrow svg{transform:rotate(90deg);width:40px;margin:0 auto}
  .arrow{display:flex;justify-content:center}
}
</style>
</head>
<body>
<main>
  <h1>The GitHub road</h1>
  <p class="lead">Your work moves through four steps. Click a step to read what it means and what to watch out for.</p>
  <p class="hint">The moving dot shows the direction your work travels. Before it goes public, there is a gate where it stops.</p>
  <ol class="flow" id="flow"></ol>
  <section id="detail" aria-live="polite"></section>
</main>
<footer>Made with CreateCodeBox</footer>
<script>
(function(){
  var STEPS=[
    {n:"1",t:"A folder on your computer",w:"Where you work now",
     one:"This is a folder on your own computer. What you make appears here first.",
     care:"If your computer breaks, this folder is lost. Save and back up your work. Keys and passwords go in `~/.createcodebox`, outside the workspace. Only the keys for the app you build go in `src/.env`."},
    {n:"2",t:"Save",w:"A record on your computer",
     one:"Save keeps a record of how your work looks now, with a short note. The record stays on your computer.",
     care:"Before it records, the workspace checks for keys in known formats. Save works only on your computer, so it is not a backup."},
    {n:"3",t:"Backup",w:"A private repo on GitHub",
     one:"Backup sends your saved records to a private place online. You decide who can open it. If your computer breaks, the copy is still there.",
     care:"Always make the repo private. When Git asks you to sign in, do it yourself. Never give a token or a password to Claude. We have not tested the sign-in with real GitHub yet."},
    {n:"4",t:"Publish",w:"Everyone can see it",gate:true,
     one:"Publish sends your work to the repo you registered. After it sends, you make the repo public yourself on the GitHub website. Your work moves on only if it passes the gate.",
     care:"When you go public, everyone can see the files and the whole history. It is hard to take back. Your work moves on only after the check passes and you type exactly: publish. If you are not sure, keep it private."}
  ];
  var flow=document.getElementById("flow");
  var detail=document.getElementById("detail");
  var SVGNS="http://www.w3.org/2000/svg";
  var boxes=[],dots=[];

  function el(tag,cls,text){
    var e=document.createElement(tag);
    if(cls){e.className=cls;}
    if(text!==undefined){e.textContent=text;}
    return e;
  }
  function rich(parent,text){
    text.split("`").forEach(function(part,i){
      if(i%2===1){parent.appendChild(el("code",null,part));}
      else if(part){parent.appendChild(document.createTextNode(part));}
    });
    return parent;
  }
  function svgEl(tag,attrs){
    var e=document.createElementNS(SVGNS,tag);
    for(var k in attrs){e.setAttribute(k,attrs[k]);}
    return e;
  }
  function show(i){
    var s=STEPS[i];
    for(var j=0;j<boxes.length;j++){boxes[j].setAttribute("aria-pressed",j===i?"true":"false");}
    detail.textContent="";
    detail.appendChild(el("h2",null,s.n+". "+s.t+(s.gate?" (a gate)":"")));
    detail.appendChild(el("h3",null,"In one line"));
    detail.appendChild(el("p",null,s.one));
    detail.appendChild(el("h3",null,"Watch out"));
    detail.appendChild(rich(el("p"),s.care));
  }
  function makeArrow(){
    var wrap=el("div","arrow");
    wrap.setAttribute("aria-hidden","true");
    var svg=svgEl("svg",{viewBox:"0 0 44 44"});
    svg.appendChild(svgEl("line",{x1:"4",y1:"22",x2:"32",y2:"22"}));
    svg.appendChild(svgEl("polygon",{points:"30,14 42,22 30,30"}));
    var dot=svgEl("circle",{"class":"dot",cx:"4",cy:"22",r:"5"});
    svg.appendChild(dot);
    wrap.appendChild(svg);
    dots.push(dot);
    return wrap;
  }

  STEPS.forEach(function(s,i){
    var li=el("li","step");
    var b=el("button","box"+(s.gate?" gate":""));
    b.type="button";
    b.setAttribute("aria-pressed","false");
    b.appendChild(el("span","n","Step "+s.n));
    b.appendChild(el("span","t",s.t));
    b.appendChild(el("span","w",s.w));
    if(s.gate){b.appendChild(el("span","tag","Gate: it stops here"));}
    b.addEventListener("click",function(){show(i);});
    boxes.push(b);
    li.appendChild(b);
    if(i<STEPS.length-1){li.appendChild(makeArrow());}
    flow.appendChild(li);
  });
  show(0);

  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)");
  var raf=null,start=null;
  function frame(ts){
    if(start===null){start=ts;}
    var p=((ts-start)%1800)/1800;
    for(var i=0;i<dots.length;i++){
      /* each dot starts a little later than the one before */
      var q=(p+i*0.25)%1;
      dots[i].setAttribute("cx",String(4+q*28));
    }
    raf=window.requestAnimationFrame(frame);
  }
  function apply(){
    if(reduce&&reduce.matches){
      if(raf!==null){window.cancelAnimationFrame(raf);raf=null;}
      for(var i=0;i<dots.length;i++){dots[i].setAttribute("cx","18");}
    }else if(raf===null){
      start=null;
      raf=window.requestAnimationFrame(frame);
    }
  }
  apply();
  if(reduce){
    if(reduce.addEventListener){reduce.addEventListener("change",apply);}
    else if(reduce.addListener){reduce.addListener(apply);}
  }
})();
</script>
</body>
</html>
